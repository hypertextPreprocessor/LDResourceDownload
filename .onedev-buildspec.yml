version: 53
jobs:
- name: CI
  jobExecutor: LDY-shell-executor
  steps:
  - type: CheckoutStep
    name: CheckoutStep
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: Deploy
    runInContainer: false
    interpreter:
      type: PosixInterpreter
      shell: sh
      commands: "echo \"=== 当前工作目录内容 ===\"\nwhoami\npwd\nls -la\necho \"=== 开始部署 ===\"\nif [ -d \"/home/admin/webroot/puta\" ]; then \n\tcp -r * /home/admin/webroot/puta/\nelse\n\tmkdir -p /home/admin/webroot/puta\n\tcp -r * /home/admin/webroot/puta/\nfi\nchown -R admin:admin /home/admin/webroot/puta\necho \"=== 最终确认目标目录 ===\"\nls -la /home/admin/webroot/\n"
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    branches: main
    paths: -.onedev-buildspec.yml
    userMatch: anyone
    projects: LdyPage/puta
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  includeUpstreamWhenRebuild: false
  includeDownstreamWhenRebuild: false
  timeout: 14400
