version: 53
jobs:
- name: CI
  jobExecutor: LDY-shell-executor
  steps:
  - type: CommandStep
    name: Deploy
    runInContainer: false
    interpreter:
      type: PosixInterpreter
      shell: sh
      commands: "if [ -d \"/home/admin/webroot/puta\" ]; then \n\tcp -r . /home/admin/webroot/puta/\nelse\n\tmkdir -p /home/admin/webroot/puta\n\tcp -r . /home/admin/webroot/puta/\nfi\n"
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    branches: main
    paths: -.onedev-buildspec.yml
    userMatch: anyone
    projects: LdyPage/puta
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  includeUpstreamWhenRebuild: false
  includeDownstreamWhenRebuild: false
  timeout: 14400
